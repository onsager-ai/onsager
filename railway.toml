# Onsager v2 — Railway config-as-code (ADR 0029).
#
# One container, one process: the `onsager` binary serves /api and the
# built dashboard, applies migrations at boot, and (from M1) hosts the
# scheduler in-process. No Caddy, no second service.
#
# Required variables:
#   DATABASE_URL            — auto-injected by the Railway Postgres plugin
#   ONSAGER_CREDENTIAL_KEY  — 32-byte hex AES-256-GCM key (openssl rand -hex 32)
# Optional:
#   ONSAGER_PUBLIC_URL      — https origin; turns on Secure cookies
#   DEV_LOGIN_ENABLED       — release-build opt-in for dev-login
#                             (previews set it; never set on production)

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile"
watchPatterns = [
    "crates/**",
    "apps/dashboard/**",
    "Cargo.toml",
    "Cargo.lock",
    "pnpm-lock.yaml",
    "deploy/**",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[environments.preview.deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[environments.preview.variables]
DEV_LOGIN_ENABLED = "true"
# Preview-only fleet token (ADR 0030 / #655): lets the preview-ui CI job
# dial a worker into the ephemeral pr-<N> control plane to capture live
# fleet screenshots. Low-value by construction — it only grants
# /api/fleet/connect on throwaway preview envs (which already expose
# dev-login); production sets its own token via the Railway dashboard,
# never from this file.
ONSAGER_MACHINE_TOKEN = "preview-fleet-ci"
