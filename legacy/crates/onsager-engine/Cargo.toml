[package]
name = "onsager-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The factory engine (ADR 0027): trigger handling → plan compilation → executor dispatch → event + artifact emission"

[lib]
path = "src/lib.rs"

[[bin]]
name = "onsager-scheduler"
path = "src/bin/onsager-scheduler.rs"

[[bin]]
name = "onsager-trigger"
path = "src/bin/onsager-trigger.rs"

[dependencies]
onsager-artifact    = { path = "../onsager-artifact" }
onsager-spine       = { path = "../onsager-spine" }
onsager-registry    = { path = "../onsager-registry" }
onsager-substrate   = { path = "../onsager-substrate" }
onsager-agent-spawn = { path = "../onsager-agent-spawn" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
# AES-256-GCM decrypt of the plan-scoped session token (#536) — same
# version portal uses, sourced from the workspace. The small
# `decrypt_credential` helper is replicated in `scheduler/crypto.rs`
# rather than imported from portal (seam rule: no cross-process dep).
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typetag = "0.2"
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
