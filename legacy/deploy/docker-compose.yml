# Onsager production stack.
#
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose build           # build images
#   docker compose up -d           # start everything
#   docker compose logs -f         # tail logs
#   docker compose down            # stop
#
# The stack:
#   db       — PostgreSQL 16 (shared event spine)
#   migrate  — runs spine Postgres migrations, then exits
#   onsager  — Caddy edge + portal (API, dashboard, in-process agent
#              sessions) + substrate scheduler (port 8080)
#
# Agent sessions:
#   Portal's in-process session runner spawns `claude` (Claude Code CLI)
#   as a subprocess (ADR 0027 / #583). The AGENT_WORKSPACE_DIR host
#   directory is bind-mounted into the container so agents can clone
#   repos and make changes that persist across restarts. Credentials
#   (CLAUDE_CODE_OAUTH_TOKEN) are added via Dashboard > Settings.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onsager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-onsager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - onsager-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onsager}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../crates/onsager-spine/migrations:/spine-migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: >
      sh -c "
        echo '==> Running spine migrations...' &&
        psql -X -v ON_ERROR_STOP=1
          -h db -U ${POSTGRES_USER:-onsager} -d ${POSTGRES_DB:-onsager}
          -f /spine-migrations/001_initial.sql &&
        psql -X -v ON_ERROR_STOP=1
          -h db -U ${POSTGRES_USER:-onsager} -d ${POSTGRES_DB:-onsager}
          -f /spine-migrations/002_artifacts.sql &&
        echo '==> Migrations complete.'
      "

  onsager:
    build:
      context: ..
      dockerfile: deploy/onsager.Dockerfile
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${AGENT_WORKSPACE_DIR:-./workspace}:/workspace
    environment:
      # Caddy (in the same image) is the externally-reachable process on
      # $PORT; portal binds internally to PORTAL_PORT on loopback
      # (ADR 0006). Railway sets $PORT for its preview/prod
      # environments; for compose we pick 8080.
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-onsager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onsager}"
      ONSAGER_DATABASE_URL: "postgres://${POSTGRES_USER:-onsager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onsager}"
      PORTAL_MAX_SESSIONS: "${PORTAL_MAX_SESSIONS:-4}"
      PORTAL_AGENT_COMMAND: "${PORTAL_AGENT_COMMAND:-claude}"
      # GitHub OAuth (optional — auth disabled when unset)
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      ONSAGER_CREDENTIAL_KEY: "${ONSAGER_CREDENTIAL_KEY:-}"
      PORTAL_PUBLIC_URL: "${PORTAL_PUBLIC_URL:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  onsager-db:
