# Onsager dev infrastructure — v2 (ADR 0029): the only container in
# dev is Postgres. The factory itself is one host-run process
# (`just dev`); the dashboard is Vite. One compose project per
# checkout/worktree (COMPOSE_PROJECT_NAME from .envrc via direnv).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onsager
      POSTGRES_PASSWORD: onsager
      POSTGRES_DB: onsager
    # OS-assigned loopback port so host-run `cargo` (just dev) reaches
    # the db conflict-free across parallel worktrees. `just dev` reads
    # it back via `docker compose port db 5432`.
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
